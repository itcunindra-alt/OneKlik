[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  # This tells Netlify to bundle the function and include required dependencies
  included_files = ["firebase-applet-config.json"]

[[redirects]]
  # Redirect all API requests to the Netlify Function
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  # React Router SPA fallback
  from = "/*"
  to = "/index.html"
  status = 200
